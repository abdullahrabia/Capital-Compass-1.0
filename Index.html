<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 مستكشف عواصم العالم</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
    background-size: 300% 300%;
    animation: gradientShift 15s ease infinite;
    padding: 20px;
    color: #fff;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    padding: 25px;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    margin-bottom: 25px;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  header h1 {
    font-size: 2.2rem;
    margin-bottom: 8px;
    text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
  }

  header p {
    opacity: 0.9;
    font-size: 1rem;
  }

  /* شريط الأدوات */
  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 15px 20px 15px 45px;
    border: none;
    border-radius: 15px;
    font-size: 1rem;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    outline: none;
    transition: 0.3s;
  }

  .search-box input::placeholder {
    color: rgba(255, 255, 255, 0.6);
  }

  .search-box input:focus {
    background: rgba(255, 255, 255, 0.25);
    border-color: #fdbb2d;
  }

  .search-box::before {
    content: '🔍';
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.2rem;
    pointer-events: none;
  }

  .filter-select {
    padding: 15px 20px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    backdrop-filter: blur(10px);
    outline: none;
  }

  .filter-select option {
    background: #1a2a6c;
    color: #fff;
  }

  /* شبكة الدول */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .card {
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 5px;
    height: 100%;
    background: linear-gradient(180deg, #fdbb2d, #b21f1f);
    transition: width 0.3s;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    background: rgba(0, 0, 0, 0.5);
  }

  .card:hover::before {
    width: 100%;
    opacity: 0.1;
  }

  .card .flag {
    font-size: 3rem;
    margin-bottom: 10px;
    display: block;
  }

  .card .country {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .card .capital {
    font-size: 1rem;
    color: #fdbb2d;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .card .info {
    font-size: 0.85rem;
    opacity: 0.85;
    line-height: 1.6;
  }

  .card .continent-badge {
    position: absolute;
    top: 15px;
    left: 15px;
    background: rgba(253, 187, 45, 0.9);
    color: #1a2a6c;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
  }

  /* النافذة المنبثقة للتفاصيل */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(5px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
    animation: fadeIn 0.3s;
  }

  .modal-overlay.active {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: linear-gradient(135deg, #1e2a5c, #2c1a4d);
    border-radius: 25px;
    padding: 35px;
    max-width: 550px;
    width: 100%;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.2);
    animation: slideUp 0.4s;
    max-height: 90vh;
    overflow-y: auto;
  }

  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-close {
    position: absolute;
    top: 15px;
    left: 15px;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 1.3rem;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-close:hover {
    background: #e74c3c;
    transform: rotate(90deg);
  }

  .modal .modal-flag {
    font-size: 5rem;
    text-align: center;
    display: block;
    margin-bottom: 15px;
  }

  .modal h2 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .modal .modal-capital {
    text-align: center;
    font-size: 1.4rem;
    color: #fdbb2d;
    font-weight: 700;
    margin-bottom: 25px;
  }

  .modal-info {
    display: grid;
    gap: 15px;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 18px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    border-right: 4px solid #fdbb2d;
  }

  .info-row span:first-child {
    opacity: 0.8;
  }

  .info-row span:last-child {
    font-weight: 700;
    color: #fdbb2d;
  }

  /* رسالة عدم وجود نتائج */
  .no-results {
    text-align: center;
    padding: 60px 20px;
    font-size: 1.2rem;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 20px;
    display: none;
  }

  .no-results.show {
    display: block;
  }

  /* الإحصائيات */
  .stats {
    text-align: center;
    padding: 15px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 15px;
    margin-bottom: 20px;
    font-size: 0.95rem;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .stats strong {
    color: #fdbb2d;
  }

  /* تصميم متجاوب */
  @media (max-width: 600px) {
    header h1 { font-size: 1.6rem; }
    .grid { grid-template-columns: 1fr; }
    .modal { padding: 25px; }
    .modal h2 { font-size: 1.5rem; }
    .modal .modal-flag { font-size: 3.5rem; }
  }

  /* شريط تمرير مخصص */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
  ::-webkit-scrollbar-thumb {
    background: #fdbb2d;
    border-radius: 10px;
  }
</style>

    { country: 'نيوزيلندا', capital: 'ويلينغتون', flag: '🇳🇿', continent: 'أوقيانوسيا', population: '5 مليون', currency: 'دولار نيوزيلندي', language: 'الإنجليزية' },
    { country: 'فيجي', capital: 'سوفا', flag: '🇫🇯', continent: 'أوقيانوسيا', population: '900 ألف', currency: 'دولار فيجي', language: 'الإنجليزية' }
  ];

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const continentFilter = document.getElementById('continentFilter');
  const noResults = document.getElementById('noResults');
  const stats = document.getElementById('stats');
  const modalOverlay = document.getElementById('modalOverlay');

  /* ============================
     🎨 عرض البطاقات
     ============================ */
  function renderCards(data) {
    grid.innerHTML = '';

    if (data.length === 0) {
      noResults.classList.add('show');
      stats.innerHTML = '';
      return;
    }

    noResults.classList.remove('show');

    data.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <span class="continent-badge">${item.continent}</span>
        <span class="flag">${item.flag}</span>
        <div class="country">${item.country}</div>
        <div class="capital">🏛️ ${item.capital}</div>
        <div class="info">👥 ${item.population} | 💰 ${item.currency}</div>
      `;
      card.addEventListener('click', () => openModal(item));
      grid.appendChild(card);
    });

    stats.innerHTML = `📊 عدد النتائج: <strong>${data.length}</strong> دولة`;
  }

  /* ============================
     🔍 البحث والتصفية
     ============================ */
  function filterData() {
    const query = searchInput.value.trim().toLowerCase();
    const continent = continentFilter.value;

    const filtered = capitalsData.filter(item => {
      const matchesSearch =
        item.country.toLowerCase().includes(query) ||
        item.capital.toLowerCase().includes(query);
      const matchesContinent =
        continent === 'all' || item.continent === continent;
      return matchesSearch && matchesContinent;
    });

    renderCards(filtered);
  }

  searchInput.addEventListener('input', filterData);
  continentFilter.addEventListener('change', filterData);

  /* ============================
     🪟 النافذة المنبثقة
     ============================ */
  function openModal(item) {
    document.getElementById('modalFlag').textContent = item.flag;
    document.getElementById('modalCountry').textContent = item.country;
    document.getElementById('modalCapital').textContent = '🏛️ العاصمة: ' + item.capital;

    document.getElementById('modalInfo').innerHTML = `
      <div class="info-row">
        <span>🌍 القارة</span>
        <span>${item.continent}</span>
      </div>
      <div class="info-row">
        <span>👥 عدد السكان</span>
        <span>${item.population}</span>
      </div>
      <div class="info-row">
        <span>💰 العملة</span>
        <span>${item.currency}</span>
      </div>
      <div class="info-row">
        <span>🗣️ اللغة الرسمية</span>
        <span>${item.language}</span>
      </div>
    `;

    modalOverlay.classList.add('active');
  }

  function closeModal() {
    modalOverlay.classList.remove('active');
  }

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  /* ============================
     🚀 التشغيل الأولي
     ============================ */
  renderCards(capitalsData);
</script>

</body>
</html>
